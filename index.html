<script>
// ============================================================
// Local file storage manager (File System Access API + IndexedDB)
// ============================================================
//
// Persists the worklog data to a JSON file the user picks on their
// own disk (e.g. inside a Google Drive / OneDrive synced folder).
// The chosen FileSystemFileHandle is cached in IndexedDB so that on
// later visits we can try to reuse it without re-prompting the user
// for a file picker (though the browser may still ask for a
// one-click permission re-grant).

const DB_NAME = 'worklog-fs-db';
const DB_STORE = 'handles';
const HANDLE_KEY = 'worklog-file-handle';

function isFileSystemAccessSupported() {
  return typeof window !== 'undefined' &&
    'showOpenFilePicker' in window &&
    'showSaveFilePicker' in window;
}

function openHandleDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(DB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbGet(key) {
  const db = await openHandleDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function idbSet(key, value) {
  const db = await openHandleDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbDelete(key) {
  const db = await openHandleDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// Try to get a usable handle from IndexedDB, re-requesting permission
// if needed. Returns null if no handle is stored or access was denied.
// Check whether we have a stored handle and whether it currently has
// permission WITHOUT prompting (queryPermission doesn't need a user
// gesture). Returns { handle, granted } or null if no handle stored.
async function getStoredHandleInfo() {
  const handle = await idbGet(HANDLE_KEY);
  if (!handle) return null;
  try {
    const granted = await handle.queryPermission({ mode: 'readwrite' }) === 'granted';
    return { handle, granted };
  } catch (e) {
    return { handle, granted: false };
  }
}

// Re-request permission for a handle. MUST be called from within a
// user gesture (e.g. a button click) — browsers reject/auto-deny
// requestPermission() calls made outside of one (such as on page load).
async function requestHandlePermission(handle) {
  try {
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    return perm === 'granted';
  } catch (e) {
    return false;
  }
}

// Let the user pick an existing JSON file.
async function pickExistingFile() {
  const [handle] = await window.showOpenFilePicker({
    types: [{ description: 'Worklog JSON', accept: { 'application/json': ['.json'] } }],
    excludeAcceptAllOption: false,
    multiple: false,
  });
  await idbSet(HANDLE_KEY, handle);
  return handle;
}

// Let the user create a new JSON file.
async function pickNewFile(suggestedName = 'worklog.json') {
  const handle = await window.showSaveFilePicker({
    suggestedName,
    types: [{ description: 'Worklog JSON', accept: { 'application/json': ['.json'] } }],
  });
  await idbSet(HANDLE_KEY, handle);
  return handle;
}

async function readFile(handle) {
  const file = await handle.getFile();
  const text = await file.text();
  if (!text.trim()) return null;
  return JSON.parse(text);
}

async function writeFile(handle, data) {
  const writable = await handle.createWritable();
  await writable.write(JSON.stringify(data, null, 2));
  await writable.close();
}

async function forgetHandle() {
  await idbDelete(HANDLE_KEY);
}

window.WorklogFS = {
  isSupported: isFileSystemAccessSupported,
  getStoredHandleInfo,
  requestHandlePermission,
  pickExistingFile,
  pickNewFile,
  readFile,
  writeFile,
  forgetHandle,
};
</script>

const STATUS_OPTIONS = [
  { key: 'office', label: 'Office', color: '#8fa3c4' },
  { key: 'wfh', label: 'WFH', color: '#7fb6a8' },
  { key: 'leave', label: 'Leave', color: '#9b8bd4' },
  { key: 'holiday', label: 'Holiday', color: '#8b9bb4' },

// ============================================================
function WorkLogApp() {
  const [tab, setTab] = useState('log');
  const [data, setData] = useState(defaultData);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState('idle'); // idle | saving | saved | error
  const [ticketDeepLink, setTicketDeepLink] = useState(null);

  // File-backed storage state
  const [fsSupported] = useState(() => window.WorklogFS && window.WorklogFS.isSupported());
  const [fileHandle, setFileHandle] = useState(null);
  const [fileName, setFileName] = useState(null);
  const [fileStatus, setFileStatus] = useState('checking'); // checking | connected | needs-permission | disconnected | unsupported
  const pendingHandleRef = useRef(null);

  const openTicket = (ticketId) => {
    setTicketDeepLink(ticketId);
    setTab('tickets');
  };

  // On mount: check (without prompting) whether we have a previously-picked
  // file handle and whether it already has permission.
  useEffect(() => {
    (async () => {
      if (!fsSupported) {
        setFileStatus('unsupported');
        setLoaded(true);
        return;
      }
      try {
        const info = await window.WorklogFS.getStoredHandleInfo();
        if (!info) {
          setFileStatus('disconnected');
        } else if (info.granted) {
          await loadFromHandle(info.handle);
        } else {
          // We have a remembered file, but need a click to re-grant access
          pendingHandleRef.current = info.handle;
          setFileName(info.handle.name);
          setFileStatus('needs-permission');
        }
      } catch (e) {
        setFileStatus('disconnected');
      } finally {
        setLoaded(true);
      }
    })();
    // eslint-disable-next-line
  }, []);

  const loadFromHandle = async (handle) => {
    try {
      const parsed = await window.WorklogFS.readFile(handle);
      if (parsed) {
        setData({ ...defaultData, ...parsed });
      } else {
        // empty file — write current/default data to initialize it
        await window.WorklogFS.writeFile(handle, data);
      }
      setFileHandle(handle);
      setFileName(handle.name);
      setFileStatus('connected');
    } catch (e) {
      setFileStatus('disconnected');
    }
  };

  // Called from a button click — re-requests permission for the
  // remembered file handle (requires a user gesture to succeed).
  const reconnectFile = async () => {
    const handle = pendingHandleRef.current;
    if (!handle) { setFileStatus('disconnected'); return; }
    const granted = await window.WorklogFS.requestHandlePermission(handle);
    if (granted) {
      await loadFromHandle(handle);
    } else {
      setFileStatus('disconnected');
    }
  };

  const connectExisting = async () => {
    try {
      const handle = await window.WorklogFS.pickExistingFile();
      await loadFromHandle(handle);
    } catch (e) {
      // user cancelled the picker
    }
  };

  const connectNew = async () => {
    try {
      const handle = await window.WorklogFS.pickNewFile();
      await window.WorklogFS.writeFile(handle, data);
      setFileHandle(handle);
      setFileName(handle.name);
      setFileStatus('connected');
    } catch (e) {
      // user cancelled the picker
    }
  };

  const disconnectFile = async () => {
    await window.WorklogFS.forgetHandle();
    pendingHandleRef.current = null;
    setFileHandle(null);
    setFileName(null);
    setFileStatus('disconnected');
  };

  // Debounced save to the connected file
  const saveTimer = useRef(null);
  useEffect(() => {
    if (!loaded || !fileHandle) return;
    setSaveState('saving');
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await window.WorklogFS.writeFile(fileHandle, data);
        setSaveState('saved');
      } catch (e) {
        setSaveState('error');
      }
    }, 600);
    return () => clearTimeout(saveTimer.current);
  }, [data, loaded, fileHandle]);

  const update = useCallback((fn) => {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      fn(next);
      return next;
    });
  }, []);

  return (
    <div style={styles.app}>
      <style>{globalCss}</style>
      <aside style={styles.sidebar}>
        <div style={styles.brand}>
          <div style={styles.brandMark}>gg</div>
          <div style={styles.brandText}>
            <div style={styles.brandTitle}>grindset</div>
            <div style={styles.brandSub}>lock in</div>
          </div>
        </div>
        <nav style={styles.nav}>
          <NavItem icon={<Icon.log/>} label="Daily Log" active={tab==='log'} onClick={()=>setTab('log')} />
          <NavItem icon={<Icon.ticket/>} label="Tickets" active={tab==='tickets'} onClick={()=>setTab('tickets')} />
          <NavItem icon={<Icon.kb/>} label="Knowledge Base" active={tab==='kb'} onClick={()=>setTab('kb')} />
          <NavItem icon={<Icon.star/>} label="Contributions" active={tab==='contrib'} onClick={()=>setTab('contrib')} />
          <NavItem icon={<Icon.cal/>} label="Work Status" active={tab==='status'} onClick={()=>setTab('status')} />
        </nav>
        <FileConnectionPanel
          fsSupported={fsSupported}
          fileStatus={fileStatus}
          fileName={fileName}
          saveState={saveState}
          onConnectExisting={connectExisting}
          onConnectNew={connectNew}
          onDisconnect={disconnectFile}
        />
      </aside>
      <main style={styles.main}>
        {!loaded ? (
          <div style={styles.loading}>Loading…</div>
        ) : (fileStatus === 'disconnected' || fileStatus === 'unsupported') ? (
          <ConnectScreen
            fsSupported={fsSupported}
            onConnectExisting={connectExisting}
            onConnectNew={connectNew}
          />
        ) : fileStatus === 'needs-permission' ? (
          <ReconnectScreen
            fileName={fileName}
            onReconnect={reconnectFile}
            onConnectExisting={connectExisting}
            onConnectNew={connectNew}
          />
        ) : tab === 'log' ? (
          <DailyLog data={data} update={update} onOpenTicket={openTicket} />
        ) : tab === 'tickets' ? (
          <Tickets data={data} update={update} initialOpenId={ticketDeepLink} onConsumeInitialOpenId={() => setTicketDeepLink(null)} />
        ) : tab === 'kb' ? (
          <KnowledgeBase data={data} update={update} />
        ) : tab === 'contrib' ? (
          <Contributions data={data} update={update} />
        ) : (
          <WorkStatus data={data} update={update} />
        )}
      </main>
    </div>
  );
}

function NavItem({ icon, label, active, onClick }) {
  return (
    <button onClick={onClick} className="nav-item" style={{
      ...styles.navItem,
      ...(active ? styles.navItemActive : {})
    }}>
      <span style={styles.navIcon}>{icon}</span>
      <span>{label}</span>
    </button>
  );
}

// ============================================================
// FILE CONNECTION UI
// ============================================================

// Small status row at the bottom of the sidebar showing the
// connected file, save status, and a menu to change/disconnect it.
function FileConnectionPanel({ fsSupported, fileStatus, fileName, saveState, onConnectExisting, onConnectNew, onDisconnect }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const handler = (e) => {
      if (ref.current && !ref.current.contains(e.target)) setMenuOpen(false);
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  if (!fsSupported) {
    return (
      <div style={styles.saveIndicator}>
        <span style={{ ...styles.saveDot, background: '#d98a8a' }} />
        Browser unsupported
      </div>
    );
  }

  if (fileStatus !== 'connected') {
    return (
      <div style={styles.saveIndicator}>
        <span style={{ ...styles.saveDot, background: '#d98a8a' }} />
        {fileStatus === 'needs-permission' ? 'Needs reconnect' : 'Not connected'}
      </div>
    );
  }

  const dotColor = saveState === 'saving' ? '#8fa3c4' : saveState === 'error' ? '#d98a8a' : '#7fb6a8';
  const label = saveState === 'saving' ? 'Saving…' : saveState === 'error' ? 'Save failed' : 'Saved';

  return (
    <div ref={ref} style={{ position: 'relative' }}>
      <button
        className="btn-icon file-conn-btn"
        style={styles.fileConnBtn}
        onClick={() => setMenuOpen(p => !p)}
        title={fileName}
      >
        <span style={{ ...styles.saveDot, background: dotColor, flexShrink: 0 }} />
        <span style={styles.fileConnLabel}>{label} · {fileName}</span>
      </button>
      {menuOpen && (
        <div style={styles.fileConnMenu}>
          <button className="btn-secondary" style={styles.secondaryBtn} onClick={() => { setMenuOpen(false); onConnectExisting(); }}>
            <Icon.doc/> Open a different file
          </button>
          <button className="btn-secondary" style={styles.secondaryBtn} onClick={() => { setMenuOpen(false); onConnectNew(); }}>
            <Icon.addFile/> Create a new file
          </button>
          <button className="btn-secondary remove-btn" style={{ ...styles.secondaryBtn, color: '#d98a8a', borderColor: '#3a2c2c' }} onClick={() => { setMenuOpen(false); onDisconnect(); }}>
            <Icon.trash/> Disconnect file
          </button>
        </div>
      )}
    </div>
  );
}

// Full-page prompt shown when no worklog file is connected yet.
function ConnectScreen({ fsSupported, onConnectExisting, onConnectNew }) {
  if (!fsSupported) {
    return (
      <div style={styles.connectScreen}>
        <h1 style={styles.connectTitle}>Browser not supported</h1>
        <p style={styles.connectText}>
          This app saves your data to a local file using the File System Access API,
          which is currently only supported in Chrome, Edge, and other Chromium-based browsers.
          Please open this page in one of those browsers to continue.
        </p>
      </div>
    );
  }

  return (
    <div style={styles.connectScreen}>
      <h1 style={styles.connectTitle}>Connect your worklog file</h1>
      <p style={styles.connectText}>
        Your data is stored in a JSON file on your computer — for example, inside a
        Google Drive or OneDrive folder so it syncs across devices. Pick an existing
        worklog file, or create a new one to get started.
      </p>
      {window.location.protocol === 'file:' && (
        <p style={styles.connectWarning}>
          This page is open as a local file (file://). Your browser will likely
          <strong> forget the connected file every time you reopen this page</strong> in
          that mode, because file:// pages can't reliably remember permissions.
          To avoid reconnecting every time, serve this file over http:// instead —
          e.g. run <code style={styles.mdCode}>python -m http.server</code> in this folder
          and open <code style={styles.mdCode}>http://localhost:8000/grindset.html</code>,
          or host it on GitHub Pages / Netlify.
        </p>
      )}
      <div style={styles.connectActions}>
        <button className="btn-primary" style={styles.primaryBtn} onClick={onConnectExisting}>
          <Icon.doc/> Open existing file
        </button>
        <button className="btn-secondary" style={styles.secondaryBtn} onClick={onConnectNew}>
          <Icon.addFile/> Create new file
        </button>
      </div>
      <p style={styles.connectHint}>
        Your browser may ask you to grant access again next time you open this page —
        that's normal and just a single click.
      </p>
    </div>
  );
}

// Shown when we have a remembered file but the browser needs a
// fresh user click before it will re-grant filesystem permission.
function ReconnectScreen({ fileName, onReconnect, onConnectExisting, onConnectNew }) {
  return (
    <div style={styles.connectScreen}>
      <h1 style={styles.connectTitle}>Reconnect your worklog file</h1>
      <p style={styles.connectText}>
        This page remembers <strong>{fileName}</strong>, but your browser needs you to
        confirm access again for this session. Click below to reconnect — your data
        and settings will load right after.
      </p>
      <div style={styles.connectActions}>
        <button className="btn-primary" style={styles.primaryBtn} onClick={onReconnect}>
          <Icon.doc/> Reconnect {fileName}
        </button>
      </div>
      <p style={styles.connectHint}>
        Picked the wrong file before, or want to use a different one?{' '}
        <button className="btn-secondary" style={{ ...styles.secondaryBtn, display: 'inline-flex' }} onClick={onConnectExisting}>
          <Icon.doc/> Open a different file
        </button>{' '}
        or{' '}
        <button className="btn-secondary" style={{ ...styles.secondaryBtn, display: 'inline-flex' }} onClick={onConnectNew}>
          <Icon.addFile/> create a new one
        </button>.
      </p>
    </div>
  );
}

// ============================================================
// DAILY LOG
// ============================================================
function DailyLog({ data, update, onOpenTicket }) {
  const dates = Object.keys(data.logs).sort((a,b) => b.localeCompare(a));
  const today = todayStr();
  const hasToday = dates.includes(today);
  const [pickerOpen, setPickerOpen] = useState(false);
  const [filterFrom, setFilterFrom] = useState('');
  const [filterTo, setFilterTo] = useState('');

  const addToday = () => {
    update(d => {
      if (!d.logs[today]) d.logs[today] = { html: '<ul><li><br></li></ul>', ticketIds: [] };
    });
  };

  const addForDate = (dateStr) => {
    update(d => {
      if (!d.logs[dateStr]) d.logs[dateStr] = { html: '<ul><li><br></li></ul>', ticketIds: [] };
    });
    setPickerOpen(false);
  };

  const filteredDates = dates.filter(d => {
    if (filterFrom && d < filterFrom) return false;
    if (filterTo && d > filterTo) return false;
    return true;
  });

  const hasFilter = filterFrom || filterTo;
  const clearFilter = () => { setFilterFrom(''); setFilterTo(''); };

  return (
    <div style={styles.page}>
      <PageHeader
        title="Daily Log"
        subtitle={
          <>
            Record what you worked on, day by day.
            <br />
            Press <code style={styles.mdCode}>Enter</code> for a new line, <code style={styles.mdCode}>Tab</code> to indent, <code style={styles.mdCode}>-</code> for a sub-bullet, and <code style={styles.mdCode}>[]</code> for a checkbox.
          </>
        }
      />
      <div style={styles.actionRow}>
        <div style={styles.dateFilterGroup}>
          <DateField value={filterFrom} onChange={setFilterFrom} placeholder="mm/dd/yyyy" align="left" />
          <span style={styles.dateFilterSep}>–</span>
          <DateField value={filterTo} onChange={setFilterTo} placeholder="mm/dd/yyyy" align="left" />
          {hasFilter && (
            <button className="btn-icon" style={{ ...styles.iconBtn, alignSelf: 'center' }} onClick={clearFilter} title="Clear filter">
              ×
            </button>
          )}
        </div>
        {!hasToday && (
          <button className="btn-primary" style={styles.primaryBtn} onClick={addToday}>
            <Icon.plus/> Start today's entry
          </button>
        )}
        <div style={{ position: 'relative' }}>
          <button className="btn-primary" style={styles.primaryBtn} onClick={() => setPickerOpen(p => !p)}>
            <Icon.calSmall/> New Entry
          </button>
          {pickerOpen && (
            <CalendarDropdown
              existingDates={dates}
              onSelect={addForDate}
              onClose={() => setPickerOpen(false)}
            />
          )}
        </div>
      </div>
      {dates.length === 0 && (
        <EmptyState text="No entries yet. Start today's log above — it'll appear here." />
      )}
      {dates.length > 0 && filteredDates.length === 0 && (
        <EmptyState text="No entries in this date range." />
      )}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 18, marginTop: 18 }}>
        {filteredDates.map(date => (
          <LogEntry key={date} date={date} entry={data.logs[date]} tickets={data.tickets} update={update} onOpenTicket={onOpenTicket} />
        ))}
      </div>
    </div>
  );
}

// Small calendar popup for picking a date (used for "Add entry for a date")
function CalendarDropdown({ existingDates = [], onSelect, onClose, selectedDate, disableFuture = true, align = 'right' }) {
  const today = todayStr();
  const initial = selectedDate ? new Date(selectedDate + 'T00:00:00') : new Date(today + 'T00:00:00');
  const [viewDate, setViewDate] = useState(initial);
  const ref = useRef(null);

  useEffect(() => {
    const handler = (e) => {
      if (ref.current && !ref.current.contains(e.target)) onClose();
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [onClose]);

  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthName = viewDate.toLocaleString('default', { month: 'long' });
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  return (
    <div ref={ref} style={{ ...styles.calDropdown, ...(align === 'left' ? { left: 0, right: 'auto' } : {}) }}>
      <div style={styles.calDropdownHeader}>
        <button className="btn-icon" style={styles.iconBtn} onClick={() => setViewDate(new Date(year, month - 1, 1))}>‹</button>
        <div style={styles.calDropdownTitle}>{monthName} {year}</div>
        <button className="btn-icon" style={styles.iconBtn} onClick={() => setViewDate(new Date(year, month + 1, 1))}>›</button>
      </div>
      <div style={styles.calDropdownGrid}>
        {['S','M','T','W','T','F','S'].map((d, i) => (
          <div key={i} style={styles.calDropdownDayLabel}>{d}</div>
        ))}
        {cells.map((day, idx) => {
          if (day === null) return <div key={idx} />;
          const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
          const isToday = dateStr === today;
          const isFuture = disableFuture && dateStr > today;
          const hasEntry = existingDates.includes(dateStr);
          const isSelected = dateStr === selectedDate;
          return (
            <button
              key={idx}
              className="cal-dropdown-day"
              disabled={isFuture}
              onClick={() => onSelect(dateStr)}
              style={{
                ...styles.calDropdownDay,
                ...(isToday ? styles.calDropdownDayToday : {}),
                ...(hasEntry ? styles.calDropdownDayHasEntry : {}),
                ...(isFuture ? styles.calDropdownDayDisabled : {}),
                ...(isSelected ? styles.calDropdownDaySelected : {}),
              }}
            >
              {day}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// A small button showing "mm/dd/yyyy" (or placeholder) with a calendar icon,
// opening a CalendarDropdown to pick a date.
function DateField({ value, onChange, placeholder = 'mm/dd/yyyy', align = 'left', disableFuture = false, variant = 'toolbar' }) {
  const [open, setOpen] = useState(false);
  const display = value
    ? (() => {
        const [y, m, d] = value.split('-');
        return `${m}/${d}/${y}`;
      })()
    : placeholder;

  const isInput = variant === 'input';

  return (
    <div style={{ position: 'relative', display: 'flex', alignItems: 'stretch', ...(isInput ? { width: '100%' } : {}) }}>
      <button
        type="button"
        className={isInput ? 'date-field-btn' : 'btn-toolbar date-field-btn'}
        style={isInput ? styles.dateFieldInputBtn : styles.dateFieldBtn}
        onClick={() => setOpen(p => !p)}
      >
        <Icon.calSmall/>
        <span style={value ? undefined : styles.dateFieldPlaceholder}>{display}</span>
      </button>
      {open && (
        <CalendarDropdown
          existingDates={[]}
          selectedDate={value}
          disableFuture={disableFuture}
          align={align}
          onSelect={(d) => { onChange(d); setOpen(false); }}
          onClose={() => setOpen(false)}
        />
      )}
    </div>
  );
}

// Small inline confirmation popup, used before destructive actions
function ConfirmDropdown({ message, onConfirm, onCancel, confirmLabel = 'Delete' }) {
  const ref = useRef(null);

  useEffect(() => {
    const handler = (e) => {
      if (ref.current && !ref.current.contains(e.target)) onCancel();
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [onCancel]);

  return (
    <div ref={ref} style={styles.confirmDropdown}>
      <div style={styles.confirmMessage}>{message}</div>
      <div style={styles.confirmActions}>
        <button className="btn-secondary" style={styles.secondaryBtn} onClick={onCancel}>Cancel</button>
        <button className="btn-danger" style={styles.dangerBtn} onClick={() => { onConfirm(); onCancel(); }}>{confirmLabel}</button>
      </div>
    </div>
  );
}

function LogEntry({ date, entry, tickets, update, onOpenTicket }) {
  const ref = useRef(null);
  const isToday = date === todayStr();

  useEffect(() => {
    if (ref.current) {
      const initial = entry.html && entry.html.trim() ? entry.html : '<ul><li><br></li></ul>';
      if (ref.current.innerHTML !== initial) {
        ref.current.innerHTML = initial;
      }
    }
    // eslint-disable-next-line
  }, []);

  // Toggle checkbox state via click — sync the `checked` attribute so it persists in innerHTML
  const handleClick = (e) => {
    if (e.target.tagName === 'INPUT' && e.target.type === 'checkbox') {
      setTimeout(() => {
        if (e.target.checked) e.target.setAttribute('checked', '');
        else e.target.removeAttribute('checked');
        handleInput();
      }, 0);
    }
  };

  const handleInput = () => {
    const html = ref.current.innerHTML;
    update(d => { d.logs[date].html = html; });
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      document.execCommand(e.shiftKey ? 'outdent' : 'indent');
      handleInput();
      return;
    }

    if (e.key === 'Enter') {
      const sel = window.getSelection();
      if (!sel.rangeCount) return;
      const range = sel.getRangeAt(0);
      let node = range.startContainer;
      let li = node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
      while (li && li.tagName !== 'LI' && li !== ref.current) li = li.parentElement;
      if (!li || li.tagName !== 'LI') return; // let browser handle non-list-item case

      // Only take over when the current line is a checkbox item — this is the
      // case the browser's native list-splitting handles unreliably, since it
      // doesn't know the leading <input> is decorative and shouldn't be duplicated.
      if (!li.classList.contains('has-checkbox')) return;

      e.preventDefault();

      // Split the li's text content at the cursor: text before cursor stays on
      // the current line, text after cursor moves to the new line.
      const fullRange = document.createRange();
      fullRange.selectNodeContents(li);
      const afterRange = range.cloneRange();
      afterRange.setEnd(fullRange.endContainer, fullRange.endOffset);
      const afterFragment = afterRange.cloneContents();
      const afterText = afterFragment.textContent.replace(/\u00A0/g, ' ').trim();

      // Remove everything from the cursor to the end of the li's content
      const deleteRange = range.cloneRange();
      deleteRange.setEnd(fullRange.endContainer, fullRange.endOffset);
      deleteRange.deleteContents();

      // Text remaining on the current line, ignoring the checkbox input itself
      const remainingText = li.textContent.replace(/\u00A0/g, '').trim();

      // Pressing Enter on an EMPTY checkbox line "exits" the checklist —
      // mirrors Notion/most checklist apps. Convert the current line into a
      // plain empty bullet in place (do NOT also insert a new line below).
      if (!remainingText && !afterText) {
        li.innerHTML = '';
        li.classList.remove('has-checkbox');
        li.appendChild(document.createElement('br'));

        const r = document.createRange();
        r.setStart(li, 0);
        r.collapse(true);
        sel.removeAllRanges();
        sel.addRange(r);

        handleInput();
        return;
      }

      // Ensure the current line still shows something after trimming
      if (!remainingText && !li.querySelector('input')) {
        li.appendChild(document.createElement('br'));
      }

      // Continue the checklist: new line also gets a checkbox
      const newLi = document.createElement('li');
      newLi.classList.add('has-checkbox');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'log-checkbox';
      newLi.appendChild(checkbox);
      newLi.appendChild(document.createTextNode(afterText ? afterText : '\u00A0'));
      li.after(newLi);

      // Place cursor right after the checkbox, before any carried-over text
      const r = document.createRange();
      r.setStart(newLi.lastChild, afterText ? 0 : 1);
      r.collapse(true);
      sel.removeAllRanges();
      sel.addRange(r);

      handleInput();
    }
  };

  // Notion-style shortcuts, checked after every input:
  //  "[] " or "[ ] " at the start of a line -> checkbox
  //  "- " at the start of a line -> nested sub-bullet
  const handleKeyUp = (e) => {
    if (e.key !== ' ') return;
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    let node = range.startContainer;
    let li = node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
    while (li && li.tagName !== 'LI' && li !== ref.current) li = li.parentElement;

    // Case: the line "broke out" of the list and is a direct child of the editor
    // (can happen after Enter on an empty nested bullet). Convert it back into an <li>.
    if (li === ref.current) {
      // The line is either the text node itself (direct child of editor)
      // or some wrapping element whose parent is the editor.
      let lineEl = node;
      while (lineEl && lineEl.parentNode !== ref.current) lineEl = lineEl.parentNode;
      if (!lineEl) return;
      const raw = lineEl.textContent;
      if (/^\s*-\s$/.test(raw) || /^\s*(\[ ?\])\s$/.test(raw)) {
        const newLi = document.createElement('li');
        // Create a fresh <ul> exactly where this line currently sits in the
        // editor — do NOT search for/reuse some other existing <ul> elsewhere
        // in the document, or the new bullet ends up inserted in the wrong list.
        const rootUl = document.createElement('ul');
        ref.current.insertBefore(rootUl, lineEl);
        rootUl.appendChild(newLi);
        const cbMatch2 = raw.match(/^\s*(\[ ?\])\s$/);
        if (cbMatch2) {
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'log-checkbox';
          newLi.classList.add('has-checkbox');
          newLi.appendChild(checkbox);
          const textNode = document.createTextNode('\u00A0');
          newLi.appendChild(textNode);
          const r = document.createRange();
          r.setStart(textNode, 1);
          r.collapse(true);
          sel.removeAllRanges();
          sel.addRange(r);
        } else {
          newLi.appendChild(document.createElement('br'));
          const r = document.createRange();
          r.setStart(newLi, 0);
          r.collapse(true);
          sel.removeAllRanges();
          sel.addRange(r);
        }
        lineEl.remove();
        handleInput();
        return;
      }
      return;
    }

    if (!li || li.tagName !== 'LI') return;

    // Use the li's full text content (covers any nested spans/nbsp browsers add)
    const raw = li.textContent;

    // --- Checkbox: "[] " or "[ ] " ---
    const cbMatch = raw.match(/^\s*(\[ ?\])\s$/);
    if (cbMatch) {
      // Rebuild the li: checkbox + empty text node, cursor after checkbox
      li.innerHTML = '';
      li.classList.add('has-checkbox');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'log-checkbox';
      li.appendChild(checkbox);
      const textNode = document.createTextNode('\u00A0');
      li.appendChild(textNode);
      const r = document.createRange();
      r.setStart(textNode, 1);
      r.collapse(true);
      sel.removeAllRanges();
      sel.addRange(r);
      handleInput();
      return;
    }

    // --- Bullet: "- " creates a nested sub-bullet list ---
    if (/^\s*-\s$/.test(raw)) {
      li.innerHTML = '';
      const sublist = document.createElement('ul');
      const subitem = document.createElement('li');
      subitem.appendChild(document.createElement('br'));
      sublist.appendChild(subitem);
      li.appendChild(document.createElement('br'));
      li.appendChild(sublist);
      const r = document.createRange();
      r.setStart(subitem, 0);
      r.collapse(true);
      sel.removeAllRanges();
      sel.addRange(r);
      handleInput();
      return;
    }
  };

  const linkedTicketIds = entry.ticketIds || [];

  const toggleTicket = (tid) => {
    update(d => {
      const cur = d.logs[date].ticketIds || [];
      if (cur.includes(tid)) d.logs[date].ticketIds = cur.filter(x => x !== tid);
      else d.logs[date].ticketIds = [...cur, tid];
    });
  };

  const deleteEntry = () => {
    update(d => { delete d.logs[date]; });
  };

  const [confirmDelete, setConfirmDelete] = useState(false);

  return (
    <div style={styles.logCard}>
      <div style={styles.logCardHeader}>
        <div>
          <div style={styles.logDate}>{formatDateLabel(date)}</div>
          {isToday && <span style={styles.todayBadge}>Today</span>}
        </div>
        <div style={{ position: 'relative' }}>
          <button className="btn-icon delete-icon-btn" style={styles.iconBtn} onClick={() => setConfirmDelete(true)} title="Delete entry">
            <Icon.trash/>
          </button>
          {confirmDelete && (
            <ConfirmDropdown
              message="Delete this day's entry? This can't be undone."
              onConfirm={deleteEntry}
              onCancel={() => setConfirmDelete(false)}
            />
          )}
        </div>
      </div>

      <div
        ref={ref}
        className="log-editor"
        contentEditable
        suppressContentEditableWarning
        onInput={handleInput}
        onKeyDown={handleKeyDown}
        onKeyUp={handleKeyUp}
        onClick={handleClick}
        style={styles.editor}
      />

      {tickets.length > 0 && (
        <TicketLinker
          tickets={tickets}
          linkedIds={linkedTicketIds}
          onToggle={toggleTicket}
          onOpenTicket={onOpenTicket}
        />
      )}
    </div>
  );
}

// Linked-ticket picker: shows linked tickets as removable chips,
// plus a searchable dropdown to add more (scales to many tickets).
function TicketLinker({ tickets, linkedIds, onToggle, onOpenTicket }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState('');
  const ref = useRef(null);

  useEffect(() => {
    const handler = (e) => {
      if (ref.current && !ref.current.contains(e.target)) { setOpen(false); setQuery(''); }
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const linked = tickets.filter(t => linkedIds.includes(t.id));
  const filtered = tickets.filter(t => {
    if (linkedIds.includes(t.id)) return false;
    const q = query.toLowerCase();
    if (!q) return true;
    return (t.code || '').toLowerCase().includes(q) || (t.title || '').toLowerCase().includes(q);
  });

  return (
    <div style={styles.ticketRow}>
      <span style={styles.ticketRowLabel}>Linked tickets:</span>
      {linked.map(t => (
        <span key={t.id} className="ticket-chip" style={{ ...styles.ticketChip, ...styles.ticketChipActive }}>
          <span
            className="ticket-chip-label"
            style={styles.ticketChipLabel}
            onClick={() => onOpenTicket && onOpenTicket(t.id)}
            title="View ticket"
          >
            {t.code || 'NO-CODE'}
          </span>
          <button
            className="ticket-chip-remove"
            style={styles.ticketChipRemove}
            onClick={() => onToggle(t.id)}
            title="Unlink"
          >×</button>
        </span>
      ))}
      <div ref={ref} style={{ position: 'relative' }}>
        <button className="btn-toolbar link-ticket-btn" style={styles.toolbarBtn} onClick={() => setOpen(p => !p)}>
          <Icon.plus/> Link ticket
        </button>
        {open && (
          <div style={styles.ticketDropdown}>
            <input
              autoFocus
              style={styles.ticketDropdownSearch}
              placeholder="Search by code or title…"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
            />
            <div style={styles.ticketDropdownList}>
              {filtered.length === 0 ? (
                <div style={styles.ticketDropdownEmpty}>
                  {tickets.length === linked.length ? 'All tickets linked' : 'No matches'}
                </div>
              ) : filtered.map(t => (
                <div
                  key={t.id}
                  className="ticket-dropdown-item"
                  style={styles.ticketDropdownItem}
                  onClick={() => { onToggle(t.id); setQuery(''); }}
                >
                  <span style={styles.ticketCode}>{t.code || 'NO-CODE'}</span>
                  <span style={styles.ticketDropdownItemTitle}>{t.title || 'Untitled ticket'}</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ============================================================
// TICKETS
// ============================================================
function Tickets({ data, update, initialOpenId, onConsumeInitialOpenId }) {
  const [openId, setOpenId] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [query, setQuery] = useState('');
  const cardRefs = useRef({});

  // Deep-link: open and scroll to a specific ticket (e.g. from Daily Log)
  useEffect(() => {
    if (!initialOpenId) return;
    setOpenId(initialOpenId);
    setQuery('');
    const el = cardRefs.current[initialOpenId];
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (onConsumeInitialOpenId) onConsumeInitialOpenId();
    // eslint-disable-next-line
  }, [initialOpenId]);

  const addTicket = () => {
    const id = uid();
    update(d => {
      d.tickets.unshift({ id, code: '', title: '', notes: '' });
    });
    setOpenId(id);
  };

  const removeTicket = (id) => {
    update(d => { d.tickets = d.tickets.filter(t => t.id !== id); });
    if (openId === id) setOpenId(null);
  };

  const q = query.trim().toLowerCase();
  const tickets = data.tickets.filter(t => {
    if (!q) return true;
    return (t.code || '').toLowerCase().includes(q) || (t.title || '').toLowerCase().includes(q);
  });

  return (
    <div style={styles.page}>
      <PageHeader title="Tickets" subtitle="JIRA tickets assigned to you. Link them to log entries from the Daily Log." />
      <div style={styles.actionRow}>
        <div style={styles.searchInputWrap}>
          <span style={styles.searchIcon}><Icon.search/></span>
          <input
            style={styles.searchInput}
            placeholder="Search by code or title…"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
          />
        </div>
        <button className="btn-primary" style={styles.primaryBtn} onClick={addTicket}><Icon.plus/> New ticket</button>
      </div>

      {data.tickets.length === 0 && <EmptyState text="No tickets yet. Add one to start linking your daily log entries." />}
      {data.tickets.length > 0 && tickets.length === 0 && <EmptyState text="No tickets match your search." />}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 18 }}>
        {tickets.map(t => {
          // count linked log entries
          const linkedDates = Object.entries(data.logs)
            .filter(([, e]) => (e.ticketIds || []).includes(t.id))
            .map(([date]) => date)
            .sort((a,b) => b.localeCompare(a));

          return (
            <div key={t.id} ref={(el) => { cardRefs.current[t.id] = el; }} style={styles.card}>
              <div className="ticket-card-header" style={styles.ticketCardHeader} onClick={() => setOpenId(openId === t.id ? null : t.id)}>
                <span style={{ ...styles.chevronIcon, transform: openId === t.id ? 'rotate(90deg)' : 'rotate(0deg)' }}>
                  <Icon.chevron/>
                </span>
                <span style={styles.ticketCode}>{t.code || 'NO-CODE'}</span>
                <span style={styles.ticketTitle}>{t.title || 'Untitled ticket'}</span>
                {linkedDates.length > 0 && (
                  <span style={styles.ticketLinkCount}>{linkedDates.length} log{linkedDates.length>1?'s':''}</span>
                )}
                <div style={{ position: 'relative' }}>
                  <button
                    className="btn-icon delete-icon-btn" style={styles.iconBtn}
                    onClick={(e) => { e.stopPropagation(); setConfirmDeleteId(t.id); }}
                    title="Delete ticket"
                  >
                    <Icon.trash/>
                  </button>
                  {confirmDeleteId === t.id && (
                    <ConfirmDropdown
                      message="Delete this ticket? Linked log entries will keep their text but lose the link."
                      onConfirm={() => removeTicket(t.id)}
                      onCancel={() => setConfirmDeleteId(null)}
                    />
                  )}
                </div>
              </div>
              {openId === t.id && (
                <div style={styles.ticketBody}>
                  <div style={styles.fieldRow}>
                    <label style={styles.label}>Code</label>
                    <input
                      style={styles.input}
                      value={t.code}
                      placeholder="e.g. PROJ-1234"
                      onChange={(e) => update(d => {
                        d.tickets.find(x => x.id === t.id).code = e.target.value;
                      })}
                    />
                  </div>
                  <div style={styles.fieldRow}>
                    <label style={styles.label}>Title</label>

// ============================================================
function KnowledgeBase({ data, update }) {
  const [activeId, setActiveId] = useState(null);
  const [expanded, setExpanded] = useState({});
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [editMode, setEditMode] = useState(true);

  const items = data.kb;
  const active = items.find(i => i.id === activeId);

  const toggleExpand = (id) => setExpanded(p => ({ ...p, [id]: !p[id] }));

  const addItem = (type, parentId) => {
    const id = uid();
    update(d => {
      d.kb.push({
        id, type, parentId: parentId || null,
        name: type === 'folder' ? 'New folder' : 'New document',
        content: ''
      });
    });
    if (parentId) setExpanded(p => ({ ...p, [parentId]: true }));
    if (type === 'doc') { setActiveId(id); setEditMode(true); }
  };

  const removeItem = (id) => {
    // remove item and any descendants
    update(d => {
      const toRemove = new Set([id]);
      let changed = true;
      while (changed) {
        changed = false;
        for (const it of d.kb) {
          if (it.parentId && toRemove.has(it.parentId) && !toRemove.has(it.id)) {
            toRemove.add(it.id);
            changed = true;
          }
        }
      }
      d.kb = d.kb.filter(it => !toRemove.has(it.id));
    });
    if (activeId === id) setActiveId(null);
  };

  const rename = (id, name) => {
    update(d => { d.kb.find(i => i.id === id).name = name; });
  };

  const renderTree = (parentId, depth) => {
    const children = items.filter(i => i.parentId === parentId);
    return children.map(item => (
      <div key={item.id}>
        <div
          className="kb-row"
          style={{ ...styles.kbRow, paddingLeft: 12 + depth * 14, ...(activeId === item.id ? styles.kbRowActive : {}) }}
          onClick={() => item.type === 'folder' ? toggleExpand(item.id) : (setActiveId(item.id), setEditMode(false))}
        >
          {item.type === 'folder' ? (
            <span style={{ ...styles.chevronIcon, transform: expanded[item.id] ? 'rotate(90deg)' : 'rotate(0deg)' }}>
              <Icon.chevron/>
            </span>
          ) : <span style={{ width: 14, display: 'inline-block' }} />}
          <span style={{ color: item.type === 'folder' ? '#8fa3c4' : '#8b9bb4', flexShrink: 0, display: 'flex' }}>
            {item.type === 'folder' ? <Icon.folder/> : <Icon.doc/>}
          </span>
          <input
            style={styles.kbNameInput}
            value={item.name}
            onChange={(e) => rename(item.id, e.target.value)}
            onClick={(e) => e.stopPropagation()}
          />
          <div className="kb-row-actions" style={{ ...styles.kbRowActions, ...(confirmDeleteId === item.id ? { opacity: 1 } : {}) }}>
            {item.type === 'folder' && (
              <>
                <button className="btn-icon" style={styles.iconBtn} onClick={(e) => { e.stopPropagation(); addItem('folder', item.id); }} title="New subfolder"><Icon.addFolder/></button>
                <button className="btn-icon" style={styles.iconBtn} onClick={(e) => { e.stopPropagation(); addItem('doc', item.id); }} title="New document"><Icon.addFile/></button>
              </>
            )}
            <div style={{ position: 'relative' }}>
              <button className="btn-icon delete-icon-btn" style={styles.iconBtn} onClick={(e) => { e.stopPropagation(); setConfirmDeleteId(item.id); }} title="Delete">
                <Icon.trash/>
              </button>
              {confirmDeleteId === item.id && (
                <ConfirmDropdown
                  message={
                    item.type === 'folder'
                      ? "Delete this folder and everything inside it? This can't be undone."
                      : "Delete this document? This can't be undone."
                  }
                  onConfirm={() => removeItem(item.id)}
                  onCancel={() => setConfirmDeleteId(null)}
                />
              )}
            </div>
          </div>
        </div>
        {item.type === 'folder' && expanded[item.id] && renderTree(item.id, depth + 1)}
      </div>
    ));
  };

  return (
    <div style={styles.page}>
      <PageHeader title="Knowledge Base" subtitle="Organize notes your way — folders and documents, like a personal drive." />
      <div style={styles.kbLayout}>
        {!sidebarCollapsed ? (
          <div style={{ ...styles.kbSidebar, ...(active ? {} : styles.kbSidebarFull) }}>
            <div style={{ display: 'flex', gap: 8, marginBottom: 10, justifyContent: 'space-between' }}>
              <button className="btn-icon" style={styles.iconBtn} onClick={() => setSidebarCollapsed(true)} title="Collapse sidebar">
                <Icon.panelLeft/>
              </button>
              <div style={{ display: 'flex', gap: 8 }}>
                <button className="btn-icon" style={styles.iconBtn} onClick={() => addItem('folder', null)} title="New folder"><Icon.addFolder/></button>
                <button className="btn-icon" style={styles.iconBtn} onClick={() => addItem('doc', null)} title="New document"><Icon.addFile/></button>
              </div>
            </div>
            {items.filter(i => !i.parentId).length === 0 && (
              <EmptyState text="No folders or docs yet." />
            )}
            {renderTree(null, 0)}
          </div>
        ) : (
          <div style={styles.kbSidebarCollapsed}>
            <button className="btn-icon" style={styles.iconBtn} onClick={() => setSidebarCollapsed(false)} title="Expand sidebar">
              <Icon.panelLeft/>
            </button>
          </div>
        )}
        {active && (
          <>
            <div style={styles.kbDivider} />
            <div key={active.id} className="kb-content-panel" style={styles.kbContent}>
              <div style={styles.kbDocHeader}>
                <input
                  style={styles.kbDocTitle}
                  value={active.name}
                  onChange={(e) => rename(active.id, e.target.value)}
                />
                <div style={{ display: 'flex', gap: 6 }}>
                  <button
                    className="btn-secondary"
                    style={{ ...styles.secondaryBtn, ...(editMode ? styles.secondaryBtnActive : {}) }}
                    onClick={() => setEditMode(true)}
                  >Edit</button>
                  <button
                    className="btn-secondary"
                    style={{ ...styles.secondaryBtn, ...(!editMode ? styles.secondaryBtnActive : {}) }}
                    onClick={() => setEditMode(false)}
                  >Preview</button>
                </div>
              </div>
              {editMode ? (
                <textarea
                  style={styles.kbDocBody}
                  value={active.content}
                  placeholder="Write anything — terminology, how-tos, FAQs, contacts…&#10;&#10;# Heading&#10;## Subheading&#10;**bold** _italic_&#10;- bullet point&#10;1. numbered item&#10;> quote&#10;`inline code`"
                  onChange={(e) => update(d => { d.kb.find(i => i.id === active.id).content = e.target.value; })}
                />
              ) : (
                <div className="kb-preview" style={styles.kbPreview}>
                  {active.content
                    ? <MarkdownView text={active.content} />
                    : <span style={{ color: colors.muted }}>Nothing here yet — switch to Edit to start writing.</span>}
                </div>
              )}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// Lightweight markdown renderer for Notion-like typography
function MarkdownView({ text }) {
  const lines = text.split('\n');
  const blocks = [];

  // listStack holds open list levels: { type: 'ul'|'ol', indent, items: [] }
  let listStack = [];

  const inline = (str) => {
    // bold, italic, code
    const parts = [];
    let remaining = str;
    let key = 0;
    const regex = /(\*\*([^*]+)\*\*|_([^_]+)_|`([^`]+)`)/;
    while (remaining.length) {
      const m = remaining.match(regex);
      if (!m) { parts.push(remaining); break; }
      if (m.index > 0) parts.push(remaining.slice(0, m.index));
      if (m[2] !== undefined) parts.push(<strong key={key++}>{m[2]}</strong>);
      else if (m[3] !== undefined) parts.push(<em key={key++}>{m[3]}</em>);
      else if (m[4] !== undefined) parts.push(<code key={key++} style={styles.mdCode}>{m[4]}</code>);
      remaining = remaining.slice(m.index + m[0].length);
    }
    return parts;
  };

  // Render a list level (and its nested children) into a <ul>/<ol>
  const ulMarkerClasses = ['md-ul-disc', 'md-ul-circle', 'md-ul-square'];

  const renderList = (level, depth = 0) => {
    const Tag = level.type === 'ul' ? 'ul' : 'ol';
    const baseStyle = level.type === 'ul' ? styles.mdUl : styles.mdOl;
    const className = level.type === 'ul' ? ulMarkerClasses[depth % ulMarkerClasses.length] : undefined;
    return (
      <Tag style={baseStyle} className={className}>
        {level.items.map((item, i) => (
          <li key={i} style={styles.mdLi}>
            {inline(item.text)}
            {item.children && renderList(item.children, depth + 1)}
          </li>
        ))}
      </Tag>
    );
  };

  const flushList = () => {
    if (listStack.length === 0) return;
    blocks.push(<React.Fragment key={blocks.length}>{renderList(listStack[0])}</React.Fragment>);
    listStack = [];
  };

  // Add a list item at a given indent depth, creating/closing nested levels as needed
  const addListItem = (indent, type, text) => {
    if (listStack.length === 0) {
      const root = { type, indent, items: [] };
      listStack.push(root);
    }
    // Close levels deeper than or equal to (different type at same indent) this indent
    while (
      listStack.length > 1 &&
      (indent < listStack[listStack.length - 1].indent ||
        (indent === listStack[listStack.length - 1].indent && listStack[listStack.length - 1].type !== type && listStack.length > 1))
    ) {
      listStack.pop();
    }

    let top = listStack[listStack.length - 1];

    if (indent > top.indent) {
      // open a new nested level under the last item of the current top
      const lastItem = top.items[top.items.length - 1];
      const child = { type, indent, items: [] };
      if (lastItem) {
        lastItem.children = child;
      } else {
        // no parent item to nest under; treat as same level
        top.items.push({ text });
        return;
      }
      listStack.push(child);
      child.items.push({ text });
      return;
    }

    if (indent === top.indent && top.type !== type) {
      // switch list type at the same level
      top.type = type;
    }

    top.items.push({ text });
  };

  lines.forEach((line) => {
    const trimmed = line.trim();
    const indent = line.length - line.replace(/^\s+/, '').length;

    if (/^#{1,3}\s/.test(trimmed)) {
      flushList();
      const level = trimmed.match(/^(#{1,3})/)[1].length;
      const content = trimmed.replace(/^#{1,3}\s/, '');
      const Tag = level === 1 ? 'h1' : level === 2 ? 'h2' : 'h3';
      const style = level === 1 ? styles.mdH1 : level === 2 ? styles.mdH2 : styles.mdH3;
      blocks.push(<Tag key={blocks.length} style={style}>{inline(content)}</Tag>);
    } else if (/^[-*]\s/.test(trimmed)) {
      addListItem(indent, 'ul', trimmed.replace(/^[-*]\s/, ''));
    } else if (/^\d+\.\s/.test(trimmed)) {
      addListItem(indent, 'ol', trimmed.replace(/^\d+\.\s/, ''));
    } else if (/^>\s/.test(trimmed)) {
      flushList();
      blocks.push(<blockquote key={blocks.length} style={styles.mdQuote}>{inline(trimmed.replace(/^>\s/, ''))}</blockquote>);
    } else if (trimmed === '') {
      flushList();
      blocks.push(<div key={blocks.length} style={{ height: 8 }} />);
    } else {
      flushList();
      blocks.push(<p key={blocks.length} style={styles.mdP}>{inline(trimmed)}</p>);
    }
  });
  flushList();

  return <div>{blocks}</div>;
}

function Contributions({ data, update }) {
  const [openId, setOpenId] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [query, setQuery] = useState('');

  const addItem = () => {
    const id = uid();
    update(d => {
      d.contributions.unshift({ id, title: '', date: todayStr(), impact: '', project: '' });
    });
    setOpenId(id);
  };

  const removeItem = (id) => {
    update(d => { d.contributions = d.contributions.filter(c => c.id !== id); });
    if (openId === id) setOpenId(null);
  };

  const q = query.trim().toLowerCase();
  const items = data.contributions.filter(c => {
    if (!q) return true;
    return (c.title || '').toLowerCase().includes(q) || (c.project || '').toLowerCase().includes(q);
  });

  return (
    <div style={styles.page}>
      <PageHeader title="Contributions" subtitle="Wins worth remembering — useful for reviews and standups." />

        <div style={styles.searchInputWrap}>
          <span style={styles.searchIcon}><Icon.search/></span>

            style={styles.searchInput}
            placeholder="Search by title or project…"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
          />
        </div>
        <button className="btn-primary" style={styles.primaryBtn} onClick={addItem}><Icon.plus/> New contribution</button>
      </div>

      {data.contributions.length === 0 && <EmptyState text="No contributions logged yet." />}
      {data.contributions.length > 0 && items.length === 0 && <EmptyState text="No contributions match your search." />}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 18 }}>
        {items.map(c => (
          <div key={c.id} style={styles.card}>
            <div className="ticket-card-header" style={styles.ticketCardHeader} onClick={() => setOpenId(openId === c.id ? null : c.id)}>
              <span style={{ ...styles.chevronIcon, transform: openId === c.id ? 'rotate(90deg)' : 'rotate(0deg)' }}>
                <Icon.chevron/>
              </span>
              <span style={styles.ticketCode}>{c.date || 'NO DATE'}</span>
              <span style={styles.ticketTitle}>{c.title || 'Untitled contribution'}</span>
              {c.project && (
                <span style={styles.ticketLinkCount}>{c.project}</span>
              )}
              <div style={{ position: 'relative' }}>
                <button
                  className="btn-icon delete-icon-btn" style={styles.iconBtn}
                  onClick={(e) => { e.stopPropagation(); setConfirmDeleteId(c.id); }}
                  title="Delete contribution"
                >
                  <Icon.trash/>
                </button>
                {confirmDeleteId === c.id && (
                  <ConfirmDropdown
                    message="Delete this contribution? This can't be undone."
                    onConfirm={() => removeItem(c.id)}
                    onCancel={() => setConfirmDeleteId(null)}
                  />
                )}
              </div>
            </div>
            {openId === c.id && (
              <div style={styles.ticketBody}>
                <div style={styles.fieldRow}>
                  <label style={styles.label}>Title</label>
                  <input
                    style={styles.input}
                    value={c.title}
                    placeholder="What did you do?"
                    onChange={(e) => update(d => { d.contributions.find(x=>x.id===c.id).title = e.target.value; })}
                  />
                </div>
                <div style={styles.twoColRow}>
                  <div style={styles.fieldRow}>
                    <label style={styles.label}>Date</label>
                    <DateField
                      value={c.date}
                      onChange={(val) => update(d => { d.contributions.find(x=>x.id===c.id).date = val; })}
                      placeholder="mm/dd/yyyy"
                      align="left"
                      disableFuture={false}
                      variant="input"
                    />
                  </div>
                  <div style={styles.fieldRow}>
                    <label style={styles.label}>Project / Area</label>
                    <input
                      style={styles.input}
                      value={c.project}
                      placeholder="e.g. Platform Migration"
                      onChange={(e) => update(d => { d.contributions.find(x=>x.id===c.id).project = e.target.value; })}
                    />
                  </div>
                </div>
                <div style={styles.fieldRow}>
                  <label style={styles.label}>Impact / Outcome</label>
                  <textarea
                    style={styles.textarea}
                    value={c.impact}
                    placeholder="Why it mattered…"
                    onChange={(e) => update(d => { d.contributions.find(x=>x.id===c.id).impact = e.target.value; })}
                  />
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// WORK STATUS
// ============================================================
function WorkStatus({ data, update }) {
  const [monthOffset, setMonthOffset] = useState(0);

  const now = new Date();
  const viewDate = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthName = viewDate.toLocaleString('default', { month: 'long' });

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const setStatus = (dateStr, key) => {
    update(d => {
      if (d.status[dateStr] === key) delete d.status[dateStr];
      else d.status[dateStr] = key;
    });
  };

  return (
    <div style={styles.page}>
      <PageHeader title="Work Status" subtitle="Track office, WFH, leave, and holidays — one tap per day." />

      <div style={styles.card}>
        <div style={styles.calHeader}>
          <button className="btn-secondary calendar-nav" style={styles.secondaryBtn} onClick={() => setMonthOffset(m => m - 1)}>‹</button>
          <div style={styles.calTitle}>{monthName} {year}</div>
          <button className="btn-secondary calendar-nav" style={styles.secondaryBtn} onClick={() => setMonthOffset(m => m + 1)}>›</button>
        </div>
        <div style={styles.calGrid}>
          {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => (
            <div key={d} style={styles.calDayLabel}>{d}</div>
          ))}
          {cells.map((day, idx) => {
            if (day === null) return <div key={idx} />;
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const status = data.status[dateStr];
            const statusInfo = STATUS_OPTIONS.find(o => o.key === status);
            const isToday = dateStr === todayStr();
            const isWeekend = idx % 7 === 0 || idx % 7 === 6;
            return (
              <div key={idx} style={{ ...styles.calCell, ...(isWeekend ? styles.calCellWeekend : {}), ...(isToday ? styles.calCellToday : {}) }}>
                <div style={styles.calDayNum}>{day}</div>
                {!isWeekend && (
                  <div style={styles.calCellBody}>
                    <div style={styles.calStatusRow}>
                      {STATUS_OPTIONS.map(o => (
                        <button
                          key={o.key}
                          onClick={() => setStatus(dateStr, o.key)}
                          title={o.label}
                          className="cal-dot"
                          style={{
                            ...styles.calDot,
                            background: status === o.key ? o.color : 'transparent',
                            borderColor: o.color,
                          }}
                        />
                      ))}
                    </div>
                    <div style={{ ...styles.calStatusLabel, color: statusInfo ? statusInfo.color : 'transparent' }}>{statusInfo ? statusInfo.label : '\u00A0'}</div>
                  </div>
                )}
              </div>
            );
          })}
        </div>

        <div style={styles.statusLegend}>
          {STATUS_OPTIONS.map(o => (
            <div key={o.key} style={styles.legendItem}>
              <span style={{ ...styles.legendDot, background: o.color }} />
              {o.label}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
